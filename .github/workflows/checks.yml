name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 单元测试：包格式、身份判定、导入导出编排、ILB 客户端、全模块链接检查。
      # 真机探针（tests/live）需要真实酒馆与 Chrome，不在 CI 里跑。
      - name: 单元测试
        run: node --test tests/*.test.mjs
